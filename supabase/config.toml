# Local Supabase CLI config. Generated/maintained by `supabase init`.
# `project_id` is set with `supabase link --project-ref <ref>`.
project_id = ""

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8421"
additional_redirect_urls = ["http://localhost:8421"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # local dev — skip the email round trip

[edge_runtime]
enabled = true
policy = "oneshot"

# Per-function settings — disable JWT verify so they can be invoked with the anon key.
[functions.bootstrap-demo-users]
verify_jwt = false

[functions.ai-query]
verify_jwt = false

[functions.index-kb-embeddings]
verify_jwt = false
